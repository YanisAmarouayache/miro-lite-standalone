<section
  class="whiteboard-shell"
  *ngIf="viewModel$ | async as viewModel"
  [class.is-fullscreen]="fullscreen"
  [class.has-right-panel]="!!viewModel.selectedWidget"
  (wheel)="onShellWheel($event)"
>
  <p class="error-banner" *ngIf="!viewModel.editable">
    Board is read-only until data is loaded.
  </p>
  <p class="error-banner" *ngIf="loadError$ | async as loadError">
    Load error: {{ loadError }}
  </p>
  <p class="error-banner" *ngIf="saveError$ | async as saveError">
    Save error: {{ saveError }}
  </p>

  <div class="board-layout">
    <app-widget-canvas
      #canvasRef
      [widgets]="viewModel.board.widgets"
      [chartSnapshots]="viewModel.chartSnapshots"
      [frameOverrides]="frameOverrides"
      [selectedWidgetId]="viewModel.selectedWidget?.id ?? null"
      [zoom]="zoom"
      [editable]="viewModel.editable"
      [zoomIndicatorVisible]="zoomIndicatorVisible"
      [zoomIndicatorX]="zoomIndicatorX"
      [zoomIndicatorY]="zoomIndicatorY"
      (canvasClick)="ui.clearSelection()"
      (canvasWheel)="onCanvasWheel($event)"
      (canvasContextMenu)="ui.closeContextMenu($event)"
      (selectWidget)="ui.selectWidget($event)"
      (openWidgetContextMenu)="ui.openContextMenu($event.widgetId, $event.event, viewModel.editable)"
      (startDrag)="ui.onStartDragRequest($event, viewModel.board.widgets, viewModel.editable)"
      (startResize)="ui.onStartResizeRequest($event, viewModel.editable)"
      (updateText)="ui.onWidgetTextChange($event, viewModel.editable)"
      (widgetDrop)="ui.onWidgetDrop($event, canvasRef.getCanvasElement(), zoom, viewModel.editable)"
    ></app-widget-canvas>

    <ng-container *ngIf="viewModel.panel as panel">
      <aside class="side-panel">
        <app-widget-config-panel
          [vm]="panel"
          (command)="onPanelCommand($event, panel)"
        ></app-widget-config-panel>
      </aside>
    </ng-container>
  </div>

  <app-widget-context-menu [menu]="contextMenu" (action)="ui.onContextMenuAction($event, viewModel.editable)"></app-widget-context-menu>

  <aside class="widgets-rail layers-panel">
    <header class="panel-header">
      <button
        type="button"
        class="left-panel-tab"
        [class.active]="leftPanelTab === 'widgets'"
        (click)="selectLeftPanelTab('widgets')">
        Widgets
      </button>
      <button
        type="button"
        class="left-panel-tab"
        [class.active]="leftPanelTab === 'layers'"
        (click)="selectLeftPanelTab('layers')">
        Layers
      </button>
    </header>

    <div class="layers-panel-container">
      <ng-container *ngIf="leftPanelTab === 'widgets'; else layersTabContent">
        <div class="widgets-rail-list">
          <div class="widget-group" *ngFor="let group of widgetGroups">
            <button
              type="button"
              class="widgets-rail-item widget-group-header overlay-item"
              [class.active]="isWidgetGroupExpanded(group.id)"
              (click)="toggleWidgetGroup(group.id)"
              [attr.aria-expanded]="isWidgetGroupExpanded(group.id)"
            >
              <span class="accordion-header-bar" aria-hidden="true"></span>
              <span class="widget-group-title">{{ group.title }}</span>
              <span class="widget-group-chevron">{{ isWidgetGroupExpanded(group.id) ? '▾' : '▸' }}</span>
            </button>

            <div class="widget-group-content" *ngIf="isWidgetGroupExpanded(group.id)">
              <button
                type="button"
                class="widgets-rail-item overlay-item"
                *ngFor="let definition of group.widgets"
                [disabled]="!viewModel.editable"
                draggable="true"
                (dragstart)="ui.onWidgetButtonDragStart(definition.type, $event, viewModel.editable)"
                (click)="ui.addWidget(definition.type, viewModel.editable)"
              >
                <div class="item-content-left">
                  <div class="item-main-icon-wrapper">
                    <span class="item-icon">+</span>
                  </div>
                  <span class="item-name">{{ definition.name }}</span>
                </div>
              </button>
            </div>
          </div>
        </div>
      </ng-container>

      <ng-template #layersTabContent>
        <div class="left-tab-content">
          <app-layer-list
            [widgets]="viewModel.board.widgets"
            [selectedWidgetId]="viewModel.selectedWidget?.id ?? null"
            [definitions]="availableWidgets"
            (selectWidget)="ui.selectWidget($event)"
            (openContextMenu)="ui.openContextMenu($event.widgetId, $event.event, viewModel.editable)"
            (reorderLayer)="ui.onLayerReorder($event, viewModel.editable)"
          ></app-layer-list>
        </div>
      </ng-template>
    </div>
  </aside>

  <div class="zoom-toolbar-wrapper">
    <div class="zoom-toolbar">
      <button type="button" (click)="zoomOut()">-</button>
      <button type="button" (click)="resetZoom()">{{ zoomPercent() }}%</button>
      <button type="button" (click)="zoomIn()">+</button>
      <button type="button" class="fullscreen-toggle" (click)="toggleFullscreen()">
        {{ fullscreen ? 'Exit' : 'Full' }}
      </button>
    </div>
  </div>
</section>
